<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- `viewport-fit=cover` lets the app paint under the notch and the home
       indicator; the shell pays that back with env(safe-area-inset-*) padding
       in index.css. Without it an installed PWA gets letterboxed bars.
       `maximum-scale` is deliberately NOT set: capping zoom on an admin tool
       full of IDs and mono timestamps is an accessibility failure, and iOS
       ignores it anyway. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- CSP is injected by Vite in production builds only (dev mode needs inline scripts for HMR) -->
  <title>NUMU Admin Backoffice</title>
  <!-- Internal tool: never index. A Bing search for the brand name returned this
       page as the second result, above numueg.app itself, because the shell
       answers 200 with a descriptive title. Belt-and-braces with the
       X-Robots-Tag header in vercel.json and client/public/robots.txt. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="NUMU platform admin backoffice — manage merchants, orders, customers across the NUMU e-commerce platform." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#003366" />
  <!-- PWA. The <link rel="manifest"> is injected at build time by
       vite-plugin-pwa, which is why there is no tag for it here. iOS reads
       none of the manifest for these two: without them, an installed
       backoffice opens in a Safari tab with a URL bar, and Web Push — which
       on iOS only works from a Home Screen app — never becomes available. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="NUMU Admin" />
  <!-- `black-translucent` puts the page under the status bar, which is what
       makes the navy rail run to the top edge. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- NUMU type system: Reem Kufi (display/brand, Latin + Arabic), Tajawal
       (Arabic UI/body), Space Grotesk (English UI/body), JetBrains Mono
       (IDs, timestamps, audit metadata). -->
  <link
    href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@200;300;400;500;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<!-- The design system reads this attribute to pick a register. `admin` is
     the cool, Navy-led operational one; the warm `editorial` register is for
     marketing surfaces and never appears inside the backoffice. -->

<body data-numu-register="admin">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Umami analytics loaded conditionally at runtime via main.tsx when VITE_ANALYTICS_ENDPOINT is set -->
</body>

</html>
